<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal de Contratos · Teixeira de Freitas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f5f5f5; --line:#e5e5e5; --line-2:#d4d4d4;
  --ink:#0a0a0a; --ink-2:#404040; --ink-3:#737373;
  --accent:#0a0a0a; --accent-ink:#ffffff; --focus:rgba(10,10,10,.12);
  --red:#b42318; --red-bg:#fdecea; --amber:#b54708; --amber-bg:#fef3e2;
  --yellow:#8a6d00; --yellow-bg:#fdf7d9; --green:#067647; --green-bg:#e7f6ee;
  --blue:#175cd3; --blue-bg:#e9f0fd; --gray-bg:#f0f0f0;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --radius:10px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#0a0a0a; --surface-2:#161616; --line:#262626; --line-2:#3a3a3a;
    --ink:#fafafa; --ink-2:#c4c4c4; --ink-3:#8a8a8a;
    --accent:#fafafa; --accent-ink:#0a0a0a; --focus:rgba(250,250,250,.15);
    --red:#f97066; --red-bg:#2a1210; --amber:#fdb022; --amber-bg:#2a1d0a;
    --yellow:#eaca4b; --yellow-bg:#26230b; --green:#47cd89; --green-bg:#0b2417;
    --blue:#84adff; --blue-bg:#101a30; --gray-bg:#1c1c1c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0a0a0a; --surface-2:#161616; --line:#262626; --line-2:#3a3a3a;
  --ink:#fafafa; --ink-2:#c4c4c4; --ink-3:#8a8a8a;
  --accent:#fafafa; --accent-ink:#0a0a0a; --focus:rgba(250,250,250,.15);
  --red:#f97066; --red-bg:#2a1210; --amber:#fdb022; --amber-bg:#2a1d0a;
  --yellow:#eaca4b; --yellow-bg:#26230b; --green:#47cd89; --green-bg:#0b2417;
  --blue:#84adff; --blue-bg:#101a30; --gray-bg:#1c1c1c;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* topo */
.top{max-width:1320px;margin:0 auto;padding:20px 20px 0}
.hcard{background:#fff;color:#1f2937;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.hcard-in{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;padding:20px 28px}
.brand{display:flex;gap:18px;align-items:center;min-width:0}
.logo{height:58px;width:auto;flex:none;display:block}
.brand-sep{width:1px;height:54px;background:#9ca3af}
.org{font-size:15px;line-height:1.2;color:#4b5563;letter-spacing:.2px;text-transform:uppercase}
.org b{display:block;font-weight:700;color:#374151}
.htitle{text-align:right}
.htitle .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#374151}
.htitle h1{margin:2px 0 0;font-family:"Source Serif 4",Georgia,"Times New Roman",serif;font-weight:500;font-size:30px;line-height:1.15;color:#233e94;letter-spacing:-.2px}
.htitle .pos{font-size:12.5px;color:#4b5563;margin-top:2px}
.stripe{display:grid;grid-template-columns:repeat(4,1fr);height:5px}
.stripe i:nth-child(1){background:#1f9a48}.stripe i:nth-child(2){background:#e3262b}
.stripe i:nth-child(3){background:#0ea0dc}.stripe i:nth-child(4){background:#f6cf0b}
.navbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);margin-top:14px}
.top-links{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-bottom:8px}
.pill-link{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;border:1px solid var(--line-2);cursor:pointer}
.pill-link:hover{background:var(--surface-2)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);padding:10px 14px 11px;cursor:pointer;font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:first-child{padding-left:2px}
.tab .ct{font-family:var(--mono);font-size:12px;margin-left:6px;color:var(--ink-3)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab:not([aria-selected="true"]):hover{color:var(--ink)}

main{max-width:1320px;margin:0 auto;padding:20px}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--ink-3);font-size:12.5px;margin:-4px 0 14px}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);text-align:left;cursor:pointer;position:relative}
.kpi:hover{border-color:var(--line-2)}
.kpi.static{cursor:default}
.kpi .lb{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .vl{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.4px}
.kpi .sb{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--k,transparent)}
.kpi.on{outline:2px solid var(--ink);outline-offset:-1px}

/* vencimentos */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:14px;font-weight:600}
.panel-h small{color:var(--ink-3)}
/* secretarias */
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.sec-card{all:unset;box-sizing:border-box;min-width:0;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:block}
.sec-card:hover{border-color:var(--line-2);background:var(--surface-2)}
.sec-card:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.sec-card.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sec-card .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec-card .row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;margin-top:8px}
.sec-card .vv{font-size:18px;font-weight:700;letter-spacing:-.3px;white-space:nowrap}
.sec-card .qq{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.share{height:4px;background:var(--gray-bg);border-radius:99px;margin-top:10px;overflow:hidden}
.share i{display:block;height:100%;background:var(--ink);border-radius:99px}
.sec-card .pc{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.sec-detail{padding:18px 20px}
.sec-detail h2{margin:0;font-size:20px;letter-spacing:-.3px}
.sd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}
.sd-stat{border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.sd-stat .lb{font-size:12px;color:var(--ink-3)}
.sd-stat .vl{font-size:22px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.sd-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
.sd-cols>div{min-width:0}
.sd-cols h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.stack{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--gray-bg);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.top-list{list-style:none;margin:0;padding:0}
.top-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.top-list li:last-child{border-bottom:0}
.top-list .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-list b{white-space:nowrap;flex:none}

/* filtros */
.filters{display:grid;grid-template-columns:minmax(200px,2fr) repeat(6,minmax(0,1fr)) auto;gap:8px;padding:12px;align-items:end}
.f label{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;margin:0 0 4px 2px}
.f input,.f select{width:100%;height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:0 10px;outline:none}
.f input:focus,.f select:focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
.search{position:relative}
.search input{padding-left:32px}
.search svg{position:absolute;left:10px;bottom:10px;color:var(--ink-3)}
.btns{display:flex;gap:6px}
.btn{height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{opacity:.88}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--ink-3);padding:0 14px 10px}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface-2)}

/* tabela */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th .ar{opacity:.35;margin-left:3px}
th.sorted .ar{opacity:1;color:var(--ink)}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
td .t1{font-weight:600}
td .t2{color:var(--ink-3);font-size:12.5px}
.cr{max-width:280px}
.ob{max-width:340px;color:var(--ink-2)}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-red{color:var(--red);background:var(--red-bg)}
.b-amber{color:var(--amber);background:var(--amber-bg)}
.b-yellow{color:var(--yellow);background:var(--yellow-bg)}
.b-green{color:var(--green);background:var(--green-bg)}
.b-blue{color:var(--blue);background:var(--blue-bg)}
.b-gray{color:var(--ink-2);background:var(--gray-bg)}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px;flex-wrap:wrap;color:var(--ink-2);font-size:13px}
.pager .btns .btn{height:32px}

/* pendências */
.issues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.issue-list{max-height:420px;overflow:auto}
.issue-row{display:flex;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.issue-row:hover{background:var(--surface-2)}
.issue-row:last-child{border-bottom:0}
.note{padding:14px 16px;color:var(--ink-2);font-size:13px}
.note b{color:var(--ink)}

/* ficha */
dialog{border:0;padding:0;border-radius:14px;width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink);box-shadow:0 24px 48px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:1}
.dh .k{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-weight:500}
.dh h3{margin:2px 0 6px;font-size:19px;line-height:1.25}
.x{all:unset;cursor:pointer;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--ink-2);flex:none}
.x:hover{background:var(--surface-2)}
.db{padding:6px 22px 18px}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec h4{margin:0 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-3)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px}
.grid .l{font-size:12px;color:var(--ink-3)}
.grid .v{font-weight:500;word-break:break-word}
.money{font-size:22px;font-weight:700;letter-spacing:-.3px}
.tl{margin-top:4px}
.tl-bar{height:8px;border-radius:999px;background:var(--gray-bg);position:relative;overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--ink)}
.tl-adt{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,var(--amber) 0 4px,transparent 4px 8px);opacity:.55}
.tl-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:6px;gap:8px}
.doc-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.docs{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px}
.docs li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.docs li:last-child{border-bottom:0}
.docs svg{flex:none;color:var(--ink-3)}
.docs .dn{flex:1;min-width:0;display:flex;flex-direction:column}
.docs .btn{height:32px}
.mini-doc{display:inline-flex;vertical-align:-2px;margin-left:6px;color:var(--ink-3)}
.muted{color:var(--ink-3);font-size:12.5px}
.df{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;position:sticky;bottom:0;background:var(--surface)}

.foot{max-width:1320px;margin:0 auto;padding:6px 20px 30px;color:var(--ink-3);font-size:12px}
.loading{padding:60px;text-align:center;color:var(--ink-3)}

@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters{grid-template-columns:repeat(3,minmax(0,1fr))}
  .filters .search{grid-column:1/-1}
  .issues{grid-template-columns:1fr}
  .sd-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sd-cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .top-in{padding:14px 16px 0}
  main{padding:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters{grid-template-columns:1fr 1fr}
  .grid{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
  .top{padding:12px 12px 0}
  .hcard-in{padding:16px 18px;flex-direction:column;align-items:flex-start}
  .brand{gap:12px}
  .logo{height:44px}
  .brand-sep{height:40px}
  .org{font-size:12.5px}
  .htitle{text-align:left}
  .htitle .eyebrow{font-size:10.5px;letter-spacing:1.2px}
  .htitle h1{font-size:24px}
  .sec-detail{padding:16px}
  .sd-stat .vl{font-size:18px}
}
@media print{
  body{background:#fff}
  .top,main,.foot{display:none!important}
  dialog{position:static;box-shadow:none;width:100%;max-height:none;border:0}
  dialog::backdrop{display:none}
  .x,.df{display:none!important}
  .dh,.df{position:static}
}
</style>
</head>
<body>
<header class="top">
  <div class="hcard">
    <div class="hcard-in">
      <div class="brand">
        <img class="logo" src="assets/logo.png" alt="Prefeitura de Teixeira de Freitas">
        <div class="brand-sep" aria-hidden="true"></div>
        <div class="org">Secretaria de<b>Administração</b></div>
      </div>
      <div class="htitle">
        <div class="eyebrow">Departamento Municipal de Contratos</div>
        <h1>Portal de Contratos</h1>
        <div class="pos" id="pos"></div>
      </div>
    </div>
    <div class="stripe" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  </div>
  <div class="navbar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="vig" aria-selected="true">Vigentes <span class="ct" id="ctVig"></span></button>
      <button class="tab" role="tab" data-tab="sec" aria-selected="false">Secretarias <span class="ct" id="ctSec"></span></button>
      <button class="tab" role="tab" data-tab="enc" aria-selected="false">Encerrados <span class="ct" id="ctEnc"></span></button>
      <button class="tab" role="tab" data-tab="pen" aria-selected="false">Pendências <span class="ct" id="ctPen"></span></button>
    </div>
    <nav class="top-links">
      <a class="pill-link" href="https://pncp.gov.br/app/contratos?q=13650403000128" target="_blank" rel="noopener">PNCP ↗</a>
      <a class="pill-link" id="lnkMinutas" href="https://drive.google.com/drive/folders/1DX7chOsUEijvc-8dh5yU9tL_fsQXOnEi" target="_blank" rel="noopener">Minutas ↗</a>
      <button class="pill-link" id="themeBtn" type="button" title="Alternar tema claro/escuro" aria-label="Alternar tema"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    </nav>
  </div>
</header>

<main id="app"><div class="loading">Carregando dados…</div></main>
<div class="foot" id="foot"></div>

<dialog id="ficha" aria-labelledby="fTitle"></dialog>

<script>
(() => {
const DRIVE_FILE = id => "https://drive.google.com/file/d/" + encodeURIComponent(id) + "/view";
const DRIVE_FOLDER = id => "https://drive.google.com/drive/folders/" + encodeURIComponent(id);
const fmtMB = b => b >= 1048576 ? (b / 1048576).toLocaleString("pt-BR", {maximumFractionDigits:1}) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
let MIN = {docs:{}};
const PAGE = 50;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const brl = v => v == null ? "—" : v.toLocaleString("pt-BR", {style:"currency", currency:"BRL"});
const brlShort = v => v >= 1e9 ? "R$ " + (v/1e9).toLocaleString("pt-BR",{maximumFractionDigits:2}) + " bi"
  : v >= 1e6 ? "R$ " + (v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mi"
  : v >= 1e4 ? "R$ " + (v/1e3).toLocaleString("pt-BR",{maximumFractionDigits:1}) + " mil" : brl(v);
const fmtD = iso => iso ? iso.slice(8,10) + "/" + iso.slice(5,7) + "/" + iso.slice(0,4) : "—";
const today = new Date(); today.setHours(0,0,0,0);
const daysTo = iso => iso ? Math.round((new Date(iso + "T00:00:00") - today) / 864e5) : null;

let DB, PN = {contratos:{}, so_pncp:[]}, UN = {};
const state = {
  tab: "vig",
  sel: "",
  vig: {q:"", un:"", sec:"", venc:"", pncp:"", min:"", ano:"", sort:"fe", dir:1, page:0},
  enc: {q:"", un:"", sec:"", sit:"", ano:"", sort:"fe", dir:-1, page:0},
};
let current = [];   // lista filtrada visível (para navegar na ficha)

/* ---------- carregamento ---------- */
async function getJSON(url, fallback) {
  try { const r = await fetch(url, {cache:"no-cache"}); if (!r.ok) throw 0; return await r.json(); }
  catch { return fallback; }
}
async function load() {
  DB = window.__CTX_DATA__ || await getJSON("data/contratos.json", null);
  PN = window.__CTX_PNCP__ || await getJSON("data/pncp.json", PN);
  MIN = window.__CTX_MIN__ || await getJSON("data/minutas.json", MIN);
  if (MIN.pasta_raiz) $("#lnkMinutas").href = DRIVE_FOLDER(MIN.pasta_raiz);
  if (!DB) { $("#app").innerHTML = '<div class="empty">Não foi possível carregar data/contratos.json.</div>'; return; }
  UN = DB.unidades || {};
  for (const r of DB.vigentes) prep(r, true);
  for (const r of DB.encerrados) prep(r, false);
  restore();
  render();
}
function prep(r, vig) {
  r.vig = vig;
  r.d = daysTo(r.fe);
  r.p = PN.contratos?.[r.n] || null;
  // Lei 14.133: modalidade de 2024 em diante exige PNCP; antes disso (Lei 8.666) não é cobrado.
  const anosMod = (r.mod || "").match(/(?<!\d)20\d{2}(?!\d)/g);
  r.modAno = anosMod ? +anosMod[anosMod.length - 1] : null;
  r.exigePncp = (r.modAno || r.ano || 0) >= PNCP_DESDE;
  if (r.p && r.p.st === "ausente") r.p = null;  // "não encontrado" vem sem dados do PNCP
  r.ps = !PN.verificado_em ? "nv" : r.p ? r.p.st : (r.exigePncp ? "ausente" : "fora");
  r.docs = (MIN.docs && MIN.docs[r.n]) || [];
  r.idx = fold([r.n, r.cr, r.obj, r.mod, r.sec, r.cid].join(" "));
}

/* ---------- helpers de status ---------- */
function vencBadge(r) {
  if (!r.vig) return sitBadge(r);
  const d = r.d;
  if (d == null) return '<span class="badge b-gray">sem data</span>';
  if (d < 0) return `<span class="badge b-red">vencido há ${-d} d</span>`;
  if (d === 0) return '<span class="badge b-red">vence hoje</span>';
  if (d <= 30) return `<span class="badge b-amber">${d} dia${d>1?"s":""}</span>`;
  if (d <= 90) return `<span class="badge b-yellow">${d} dias</span>`;
  return `<span class="badge b-green">${d} dias</span>`;
}
function sitBadge(r) {
  const s = r.sit;
  const cls = s === "RESCINDIDO" ? "b-red" : s === "NÃO RENOVOU" ? "b-gray" : s.includes("INCORRETA") ? "b-amber" : "b-gray";
  return `<span class="badge ${cls}">${esc(s.charAt(0) + s.slice(1).toLowerCase())}</span>`;
}
const PNCP_DESDE = 2024;
const PNCP_LBL = {ok:["Publicado","b-green"], divergente:["Divergente","b-amber"], ausente:["Não encontrado","b-red"], fora:["Lei 8.666 · não exige","b-gray"], nv:["Não verificado","b-gray"]};
const pncpBadge = r => { const [t,c] = PNCP_LBL[r.ps]; return `<span class="badge ${c}">${t}</span>`; };
const vencBucket = r => r.d == null ? "" : r.d < 0 ? "vencido" : r.d <= 30 ? "30" : r.d <= 90 ? "90" : "mais";

/* ---------- filtros ---------- */
function filtered(tab) {
  const f = state[tab];
  const rows = tab === "vig" ? DB.vigentes : DB.encerrados;
  const terms = fold(f.q).split(/\s+/).filter(Boolean);
  let out = rows.filter(r =>
    (!f.un || r.un === f.un) &&
    (!f.sec || r.sec === f.sec) &&
    (!f.ano || String(r.ano) === f.ano) &&
    (tab !== "vig" || !f.venc || vencBucket(r) === f.venc) &&
    (tab !== "vig" || !f.pncp || r.ps === f.pncp) &&
    (!f.min || (f.min === "sim") === (r.docs.length > 0)) &&
    (tab !== "enc" || !f.sit || r.sit === f.sit) &&
    terms.every(t => r.idx.includes(t)));
  const k = f.sort, dir = f.dir;
  out.sort((a, b) => {
    let x = a[k], y = b[k];
    if (x == null || x === "") return 1;
    if (y == null || y === "") return -1;
    if (typeof x === "string") return x.localeCompare(y, "pt-BR") * dir;
    return (x - y) * dir;
  });
  return out;
}
const uniq = (rows, k) => [...new Set(rows.map(r => r[k]).filter(v => v !== "" && v != null))].sort((a,b) => String(a).localeCompare(String(b), "pt-BR"));
function opts(list, sel, label = v => v) {
  return list.map(v => `<option value="${esc(v)}"${String(v) === String(sel) ? " selected" : ""}>${esc(label(v))}</option>`).join("");
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
  const pend = pendencias();
  $("#ctVig").textContent = DB.vigentes.length.toLocaleString("pt-BR");
  $("#ctEnc").textContent = DB.encerrados.length.toLocaleString("pt-BR");
  $("#ctSec").textContent = secStats().length;
  $("#ctPen").textContent = pend.total.toLocaleString("pt-BR");
  if (state.tab === "pen") renderPend(pend);
  else if (state.tab === "sec") renderSec();
  else renderList(state.tab);
  const pv = PN.verificado_em ? `PNCP verificado em ${fmtD(PN.verificado_em.slice(0,10))} às ${PN.verificado_em.slice(11,16)}` : "PNCP ainda não verificado";
  $("#pos").textContent = "Posição em " + fmtD(DB.gerado_em.slice(0,10));
  $("#foot").innerHTML = `Fonte: planilha “${esc(DB.fonte)}” · dados gerados em ${fmtD(DB.gerado_em.slice(0,10))} às ${DB.gerado_em.slice(11,16)} · ${pv} · Uso interno · Departamento Municipal de Contratos · Prefeitura Municipal de Teixeira de Freitas - BA`;
  save();
}

      ${k("90", "Vencem em 31 a 90 dias", c("90"), "planejar renovação", "var(--yellow)")}
      ${k("mais", "Mais de 90 dias", c("mais"), "situação regular", "var(--green)")}

        : `<div class="vl" style="font-size:16px;margin-top:8px">Aguardando</div><div class="sb">1ª verificação automática</div>`}</div>
    </section>`;
  }

  const anos = uniq(all, "ano").reverse();
  const secs = uniq(all, "sec");
  const filtersHtml = `<section class="panel">
    <div class="filters">
      <div class="f search"><label for="q">Pesquisar</label>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Nº, credor, objeto, modalidade…" value="${esc(f.q)}" autocomplete="off"></div>
      <div class="f"><label for="fUn">Unidade</label><select id="fUn"><option value="">Todas</option>${opts(Object.keys(UN), f.un, k => k + " · " + UN[k])}</select></div>
      <div class="f"><label for="fSec">Secretaria</label><select id="fSec"><option value="">Todas</option>${opts(secs, f.sec, v => v.charAt(0) + v.slice(1).toLowerCase())}</select></div>
      ${tab === "vig"
        ? `<div class="f"><label for="fVenc">Vencimento</label><select id="fVenc"><option value="">Todos</option>${opts(["vencido","30","90","mais"], f.venc, v => ({vencido:"Vencidos sem baixa","30":"Até 30 dias","90":"31 a 90 dias",mais:"Mais de 90 dias"})[v])}</select></div>
           <div class="f"><label for="fPncp">PNCP</label><select id="fPncp"><option value="">Todos</option>${opts(["ok","divergente","ausente","fora"], f.pncp, v => PNCP_LBL[v][0])}</select></div>`
        : `<div class="f"><label for="fSit">Situação</label><select id="fSit"><option value="">Todas</option>${opts(uniq(all, "sit"), f.sit, v => v.charAt(0) + v.slice(1).toLowerCase())}</select></div>
`}
      ${tab === "vig" ? `<div class="f"><label for="fMin">Minuta</label><select id="fMin"><option value="">Todas</option>${opts(["sim","nao"], f.min, v => v === "sim" ? "Com minuta" : "Sem minuta")}</select></div>` : ""}
      <div class="f"><label for="fAno">Ano do contrato</label><select id="fAno"><option value="">Todos</option>${opts(anos, f.ano)}</select></div>
      <div class="f btns"><button class="btn" id="clear" type="button">Limpar</button><button class="btn primary" id="csv" type="button">Exportar CSV</button></div>
    </div>
    <div class="hint"><b class="num">${rows.length.toLocaleString("pt-BR")}</b> contrato(s) · <b class="num">${brl(total)}</b> · <kbd>/</kbd> pesquisar · <kbd>Esc</kbd> limpar</div>
  </section>`;

  const th = (k, lb, cls = "") => `<th class="${cls}${f.sort === k ? " sorted" : ""}" data-sort="${k}">${lb}<span class="ar">${f.sort === k ? (f.dir > 0 ? "▲" : "▼") : "↕"}</span></th>`;
  const table = `<section class="panel"><div class="tbl-wrap"><table>
    <thead><tr>
      ${th("n", "Contrato")}${th("cr", "Credor / objeto")}${th("sec", "Secretaria", "hide-sm")}${th("v", "Valor", "r")}${th("fe", tab === "vig" ? "Fim da vigência" : "Fim")}
      <th>${tab === "vig" ? "Prazo" : "Situação"}</th>${tab === "vig" ? "<th class='hide-sm'>PNCP</th>" : ""}
    </tr></thead>
    <tbody>${slice.length ? slice.map(r => `<tr data-open="${esc(r.n)}" tabindex="0">
      <td><div class="t1 num">${esc(r.n)}${r.docs.length ? `<span class="mini-doc" title="Minuta disponível no Drive"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span>` : ""}</div><div class="t2">${esc(r.mod || "sem modalidade")}</div></td>
      <td class="cr"><div class="t1 clip">${esc(r.cr)}</div><div class="t2 ob clip">${esc(r.obj)}</div></td>
      <td class="hide-sm"><div>${esc(cap(r.sec) || "—")}</div>${UN[r.un] && fold(UN[r.un]) !== fold(r.sec) ? `<div class="t2">${esc(UN[r.un])}</div>` : ""}</td>
      <td class="r num">${brl(r.v)}</td>
      <td class="num">${fmtD(r.fe)}${r.adt ? '<div class="t2">com aditivo</div>' : ""}</td>
      <td>${vencBadge(r)}</td>${tab === "vig" ? `<td class="hide-sm">${pncpBadge(r)}</td>` : ""}
    </tr>`).join("") : `<tr><td colspan="7" class="empty">Nenhum contrato encontrado com esses filtros.</td></tr>`}</tbody>
  </table></div>
  <div class="pager"><span>Página <b class="num">${f.page + 1}</b> de <span class="num">${pages}</span></span>
    <div class="btns"><button class="btn" id="prev" ${f.page ? "" : "disabled"}>‹ Anterior</button><button class="btn" id="next" ${f.page < pages - 1 ? "" : "disabled"}>Próxima ›</button></div></div>
  </section>`;

  $("#app").innerHTML = head + filtersHtml + table;
  bindList(tab);
}
const cap = s => s ? (s.charAt(0) + s.slice(1).toLowerCase()).replace(/\(([a-zà-ú]{2,4})\)/g, (m, x) => "(" + x.toUpperCase() + ")") : "";

function bindList(tab) {
  const f = state[tab];
  const q = $("#q");
  let t;
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { f.q = q.value; f.page = 0; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); }, 160); });
  const sel = (id, key) => { const el = $(id); if (el) el.addEventListener("change", () => { f[key] = el.value; f.page = 0; render(); }); };
  sel("#fUn","un"); sel("#fSec","sec"); sel("#fVenc","venc"); sel("#fPncp","pncp"); sel("#fSit","sit"); sel("#fAno","ano"); sel("#fMin","min");
  $("#clear").onclick = () => { Object.assign(f, {q:"",un:"",sec:"",venc:"",pncp:"",min:"",sit:"",ano:"",page:0}); render(); };
  $("#csv").onclick = () => exportCSV(current, tab);
  $("#prev").onclick = () => { f.page--; render(); scrollTo({top: $("table").getBoundingClientRect().top + scrollY - 80}); };
  $("#next").onclick = () => { f.page++; render(); scrollTo({top: $("table").getBoundingClientRect().top + scrollY - 80}); };
  document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
    const k = th.dataset.sort; if (f.sort === k) f.dir *= -1; else { f.sort = k; f.dir = (k === "v") ? -1 : 1; } render(); });
  document.querySelectorAll(".kpi[data-venc]").forEach(b => b.onclick = () => { f.venc = f.venc === b.dataset.venc ? "" : b.dataset.venc; f.page = 0; render(); });
  bindOpen();
}
function bindOpen() {
  document.querySelectorAll("[data-open]").forEach(el => {
    el.onclick = () => openFicha(el.dataset.open);
    el.onkeydown = e => { if (e.key === "Enter") openFicha(el.dataset.open); };
  });
}

/* ---------- secretarias ---------- */
function secStats() {
  const m = new Map();
  for (const r of DB.vigentes) {
    const k = r.sec || "NÃO INFORMADA";
    if (!m.has(k)) m.set(k, {sec:k, rows:[], v:0});
    const o = m.get(k); o.rows.push(r); o.v += r.v || 0;
  }
  return [...m.values()].sort((a, b) => b.v - a.v);
}
function renderSec() {
  const stats = secStats();
  const totalV = stats.reduce((s, o) => s + o.v, 0);
  const totalN = DB.vigentes.length;
  const sel = stats.find(o => o.sec === state.sel);
  current = sel ? [...sel.rows].sort((a, b) => (b.v || 0) - (a.v || 0)) : [];
  let detail;
  if (sel) {
    const n = sel.rows.length;
    const media = n ? sel.v / n : 0;
    const maior = current[0];
    const enc = DB.encerrados.filter(r => (r.sec || "NÃO INFORMADA") === sel.sec).length;
    const b = {vencido:0, "30":0, "90":0, mais:0};
    sel.rows.forEach(r => { const k = vencBucket(r); if (k in b) b[k]++; });
    const seg = [["vencido","Vencidos sem baixa","var(--red)"],["30","Até 30 dias","var(--amber)"],["90","31 a 90 dias","var(--yellow)"],["mais","Mais de 90 dias","var(--green)"]];
    const cred = new Map();
    sel.rows.forEach(r => { const c = cred.get(r.cr) || {n:0, v:0}; c.n++; c.v += r.v || 0; cred.set(r.cr, c); });
    const topCred = [...cred.entries()].sort((a, b) => b[1].v - a[1].v).slice(0, 5);
    detail = `<section class="panel sec-detail">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div><div class="muted">Secretaria</div><h2>${esc(cap(sel.sec))}</h2></div>
        <div class="btns"><button class="btn" id="secClose" type="button">Fechar</button><button class="btn primary" id="secGo" type="button">Ver os ${n} contratos ›</button></div>
      </div>
      <div class="sd-stats">
        <div class="sd-stat"><div class="lb">Contratos vigentes</div><div class="vl num">${n.toLocaleString("pt-BR")}</div><div class="muted">${(n / totalN * 100).toLocaleString("pt-BR",{maximumFractionDigits:1})}% do total</div></div>
        <div class="sd-stat"><div class="lb">Valor total contratado</div><div class="vl num">${brlShort(sel.v)}</div><div class="muted num">${brl(sel.v)}</div></div>
        <div class="sd-stat"><div class="lb">Valor médio por contrato</div><div class="vl num">${brlShort(media)}</div><div class="muted">${(sel.v / totalV * 100).toLocaleString("pt-BR",{maximumFractionDigits:1})}% do valor total</div></div>
        <div class="sd-stat"><div class="lb">Encerrados no histórico</div><div class="vl num">${enc.toLocaleString("pt-BR")}</div><div class="muted">rescindidos ou não renovados</div></div>
      </div>
      <div class="sd-cols">
        <div><h4>Situação dos prazos</h4>
          <div class="stack">${seg.filter(([k]) => b[k]).map(([k,,c]) => `<i style="width:${b[k] / n * 100}%;background:${c}"></i>`).join("")}</div>
          <div class="legend">${seg.map(([k,l,c]) => `<span style="--c:${c}">${l}: <b class="num">${b[k]}</b></span>`).join("")}</div>
          ${maior ? `<h4 style="margin-top:18px">Maior contrato</h4>
          <ul class="top-list"><li data-open="${esc(maior.n)}" style="cursor:pointer"><span class="nm">${esc(maior.n)} · ${esc(maior.cr)}</span><b class="num">${brl(maior.v)}</b></li></ul>` : ""}
        </div>
        <div><h4>Principais credores (por valor)</h4>
          <ul class="top-list">${topCred.map(([c, o]) => `<li><span class="nm">${esc(c)} <span class="muted">· ${o.n} contrato${o.n > 1 ? "s" : ""}</span></span><b class="num">${brlShort(o.v)}</b></li>`).join("")}</ul>
        </div>
      </div>
    </section>`;
  } else {
    detail = `<div class="meta"><span>${stats.length} secretarias · ${totalN.toLocaleString("pt-BR")} contratos vigentes · ${brl(totalV)}. Clique em uma secretaria para ver o resumo.</span></div>`;
  }
  const maxV = stats[0]?.v || 1;
  $("#app").innerHTML = detail + `<section class="sec-grid">${stats.map(o => `
    <button class="sec-card${o.sec === state.sel ? " on" : ""}" data-sec="${esc(o.sec)}" type="button">
      <div class="nm">${esc(cap(o.sec))}</div>
      <div class="row"><span class="vv num">${brlShort(o.v)}</span><span class="qq num">${o.rows.length} contrato${o.rows.length > 1 ? "s" : ""}</span></div>
      <div class="share"><i style="width:${Math.max(1, o.v / maxV * 100)}%"></i></div>
      <div class="pc">${(o.v / totalV * 100).toLocaleString("pt-BR",{maximumFractionDigits:1})}% do valor contratado</div>
    </button>`).join("")}</section>`;
  document.querySelectorAll(".sec-card").forEach(b => b.onclick = () => {
    state.sel = state.sel === b.dataset.sec ? "" : b.dataset.sec; render(); scrollTo({top:0, behavior:"smooth"}); });
  if (sel) {
    $("#secClose").onclick = () => { state.sel = ""; render(); };
    $("#secGo").onclick = () => {
      Object.assign(state.vig, {q:"", un:"", sec: sel.sec === "NÃO INFORMADA" ? "" : sel.sec, venc:"", pncp:"", ano:"", page:0});
      state.tab = "vig"; render(); scrollTo({top:0});
    };
  }
  bindOpen();
}

/* ---------- pendências ---------- */
function pendencias() {
  const v = DB.vigentes;
  const venc = v.filter(r => r.d != null && r.d < 0).sort((a,b) => a.d - b.d);
  const semMod = v.filter(r => !r.mod);
  const semNum = v.filter(r => !r.un);
  const semMin = v.filter(r => !r.docs.length);
  const pncpProb = PN.verificado_em ? v.filter(r => r.ps === "ausente" || r.ps === "divergente") : [];
  const so = PN.so_pncp || [];
  return {venc, semMod, semNum, semMin, pncpProb, so,
    total: venc.length + semMod.length + semNum.length + pncpProb.length};
}
function renderPend(p) {
  current = [...p.venc, ...p.semMod, ...p.semNum, ...p.pncpProb];
  const list = (rows, extra) => rows.length ? rows.map(r => `<div class="issue-row" data-open="${esc(r.n)}" tabindex="0">
      <div><div class="t1 num" style="font-weight:600">${esc(r.n)}</div><div class="t2 muted">${esc(r.cr)}</div></div>
      <div style="text-align:right">${extra(r)}</div></div>`).join("") : '<div class="note">Nada pendente aqui.</div>';
  const box = (title, sub, body) => `<section class="panel"><div class="panel-h"><h2>${title}</h2><small>${sub}</small></div><div class="issue-list">${body}</div></section>`;
  const pncpBox = PN.verificado_em
    ? box("Pendências no PNCP", `${p.pncpProb.length} contrato(s) · modalidades de ${PNCP_DESDE} em diante`, list(p.pncpProb, r => pncpBadge(r) + (r.p?.obs ? `<div class="t2 muted">${esc(r.p.obs)}</div>` : "")))
    : box("Divergências com o PNCP", "aguardando 1ª verificação", `<div class="note">A conferência com o PNCP é feita pela rotina automática no GitHub, que consulta todos os contratos publicados com o CNPJ <b>13.650.403/0001-28</b> e marca cada contrato da planilha como <b>publicado</b>, <b>divergente</b> ou <b>não encontrado</b>. Ela também lista contratos que estão no PNCP mas não estão na planilha. Assim que a rotina rodar pela primeira vez, os resultados aparecem aqui.</div>`);
  const soBox = PN.verificado_em ? box("No PNCP, mas fora da planilha", `${p.so.length} contrato(s)`,
      p.so.length ? p.so.map(s => `<a class="issue-row" style="text-decoration:none;color:inherit" href="${esc(s.url)}" target="_blank" rel="noopener"><div><div style="font-weight:600" class="num">${esc(s.num || "s/ nº")}</div><div class="muted">${esc(s.forn)}</div></div><div class="num">${brl(s.v)}</div></a>`).join("") : '<div class="note">Nada pendente aqui.</div>') : "";
  $("#app").innerHTML = `
    <div class="meta"><span>Itens que pedem atenção na planilha de contratos vigentes.</span></div>
    <div class="issues">
      ${box("Vencidos sem baixa", `${p.venc.length} contrato(s) · mover para “Rescindidos” ou lançar o aditivo`, list(p.venc, r => vencBadge(r) + `<div class="t2 muted num">${fmtD(r.fe)}</div>`))}
      ${pncpBox}
      ${box("Sem nº de modalidade", `${p.semMod.length} contrato(s)`, list(p.semMod, r => `<span class="muted">${esc(r.obj)}</span>`))}
      ${box("Número fora do padrão", "esperado U-NNN-AAAA, ex.: 2-1023-2025", list(p.semNum, r => `<span class="muted">${esc(r.obj)}</span>`))}
      ${soBox}
      <section class="panel"><div class="panel-h"><h2>Minutas no Drive</h2><small>${(DB.vigentes.length - p.semMin.length).toLocaleString("pt-BR")} de ${DB.vigentes.length.toLocaleString("pt-BR")} contratos com minuta</small></div>
        <div class="note"><b class="num">${p.semMin.length.toLocaleString("pt-BR")}</b> de ${DB.vigentes.length.toLocaleString("pt-BR")} contratos vigentes ainda sem <b>minuta no Drive</b>.<br><br>
        Para incluir, salve o PDF na pasta <b>MINUTAS DE CONTRATOS</b> do Drive com o número do contrato no nome (ex.: <b>2-670-2026.pdf</b>; aditivos como <b>2-670-2026 - 1º Termo Aditivo.pdf</b>).</div></section>
      ${(DB.avisos || []).length ? `<section class="panel"><div class="panel-h"><h2>Ajustes feitos na leitura</h2><small>a planilha não foi alterada</small></div>
        <div class="note">${DB.avisos.map(a => "• " + esc(a)).join("<br>")}<br><br>Valores em formatos diferentes e nomes de secretaria com grafias diferentes (ADM/ADMINISTRAÇÃO, INFRA/INFRAESTRUTURA, SAUDE/SAÚDE…) também foram padronizados.</div></section>` : ""}
    </div>`;
  bindOpen();
}

/* ---------- ficha ---------- */
const dlg = $("#ficha");
function findRec(n) {
  return current.find(r => r.n === n) || DB.vigentes.find(r => r.n === n) || DB.encerrados.find(r => r.n === n);
}
function openFicha(n) {
  const r = findRec(n); if (!r) return;
  const pos = current.indexOf(r);
  const ini = r.ini ? new Date(r.ini + "T00:00:00") : null;
  const fim = r.fim ? new Date(r.fim + "T00:00:00") : null;
  const fe = r.fe ? new Date(r.fe + "T00:00:00") : null;
  let tl = "";
  if (ini && fe && fe > ini) {
    const span = fe - ini;
    const pct = Math.max(0, Math.min(100, (today - ini) / span * 100));
    const adtStart = r.adt && fim ? Math.max(0, Math.min(100, (fim - ini) / span * 100)) : null;
    tl = `<div class="tl"><div class="tl-bar"><div class="tl-fill" style="width:${pct}%"></div>${adtStart != null ? `<div class="tl-adt" style="left:${adtStart}%;right:0"></div>` : ""}</div>
      <div class="tl-lbl"><span>Início <b class="num">${fmtD(r.ini)}</b></span>${r.adt ? `<span>Fim original <b class="num">${fmtD(r.fim)}</b></span>` : ""}<span>${r.adt ? "Fim pelo aditivo" : "Fim"} <b class="num">${fmtD(r.fe)}</b></span></div></div>`;
  }
  const p = r.p;
  const pncpSec = !PN.verificado_em
    ? `<div class="doc-row">${pncpBadge(r)}<span class="muted">A rotina automática ainda não consultou o PNCP.</span>
       <a class="btn" href="https://pncp.gov.br/app/contratos?q=${encodeURIComponent(r.cr)}" target="_blank" rel="noopener">Procurar no PNCP ↗</a></div>`
    : p ? `<div class="doc-row">${pncpBadge(r)}${p.obs ? `<span class="muted">${esc(p.obs)}</span>` : ""}<a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">Ver no PNCP ↗</a></div>
       <div class="grid" style="margin-top:12px">
         <div><div class="l">Nº de controle PNCP</div><div class="v num">${esc(p.ctrl || "—")}</div></div>
         <div><div class="l">Valor no PNCP</div><div class="v num">${brl(p.v)}</div></div>
         <div><div class="l">Fim no PNCP</div><div class="v num">${fmtD(p.fim)}</div></div></div>
       ${(p.tas || []).length ? `<div class="l" style="margin:14px 0 6px;font-size:12px;color:var(--ink-3)">Termos aditivos publicados no PNCP</div>
         <ul class="top-list">${p.tas.map(t => `<li><span class="nm"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.num)}</a> <span class="muted">· assinado em ${fmtD(t.ass)}${t.fim ? " · fim " + fmtD(t.fim) : ""}</span></span><b class="num">${brl(t.v)}</b></li>`).join("")}</ul>` : ""}`
    : r.ps === "fora"
      ? `<div class="doc-row">${pncpBadge(r)}<span class="muted">Modalidade ${esc(r.mod || "")} anterior a ${PNCP_DESDE} (Lei 8.666/93): a publicação no PNCP não é exigida.</span></div>`
      : `<div class="doc-row">${pncpBadge(r)}<span class="muted">Nenhum contrato com o nº ${esc(r.n)} foi encontrado no PNCP. Como a modalidade é de ${r.modAno || r.ano} (Lei 14.133/21), a publicação é obrigatória.</span></div>`;
  dlg.innerHTML = `
    <div class="dh"><div><div class="k">Contrato ${esc(r.n)} · ${esc(UN[r.un] || "unidade não identificada")}</div>
      <h3 id="fTitle">${esc(r.cr)}</h3><div class="doc-row">${vencBadge(r)}${r.vig ? pncpBadge(r) : ""}</div></div>
      <button class="x" id="fx" aria-label="Fechar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="db">
      <div class="sec"><h4>Objeto</h4><div>${esc(r.obj || "—")}</div></div>
      <div class="sec"><h4>Valor e vigência</h4><div class="money num">${brl(r.v)}</div>${tl}</div>
      <div class="sec"><h4>Informações</h4><div class="grid">
        <div><div class="l">Nº da modalidade / processo</div><div class="v num">${esc(r.mod || "—")}</div></div>
        <div><div class="l">Secretaria responsável</div><div class="v">${esc(cap(r.sec) || "—")}</div></div>
        <div><div class="l">Unidade</div><div class="v">${esc(r.un ? r.un + " · " + (UN[r.un] || "") : "—")}</div></div>
        <div><div class="l">Cidade do credor</div><div class="v">${esc(r.cid || "—")}</div></div>
        <div><div class="l">Situação</div><div class="v">${esc(cap(r.sit))}${r.aba ? ` <span class="muted">(${esc(r.aba)})</span>` : ""}</div></div>
      </div></div>
      <div class="sec"><h4>Minutas e documentos</h4>
        ${r.docs.length ? `<ul class="docs">${r.docs.map(d => `<li>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>
            <div class="dn"><b>${esc(d.nome)}</b><span class="muted">${esc(d.pasta || "")}${d.tam ? " · " + fmtMB(d.tam) : ""}${d.mod ? " · " + fmtD(d.mod) : ""}</span></div>
            <a class="btn primary" href="${DRIVE_FILE(d.id)}" target="_blank" rel="noopener">Abrir ↗</a></li>`).join("")}</ul>
            <div class="muted" style="margin-top:8px">Abre no Google Drive institucional, somente com a conta da Prefeitura.</div>`
          : `<div class="doc-row"><span class="muted">Nenhuma minuta deste contrato no Drive ainda.</span>${MIN.pasta_raiz ? `<a class="btn" href="${DRIVE_FOLDER(MIN.pasta_raiz)}" target="_blank" rel="noopener">Abrir pasta de minutas ↗</a>` : ""}</div>`}
      </div>
      ${r.vig ? `<div class="sec"><h4>PNCP</h4>${pncpSec}</div>` : ""}
    </div>
    <div class="df"><button class="btn" id="fPrev" ${pos > 0 ? "" : "disabled"}>‹ Anterior</button>
      <button class="btn" id="fPrint">Imprimir / PDF</button>
      <button class="btn" id="fNext" ${pos >= 0 && pos < current.length - 1 ? "" : "disabled"}>Próximo ›</button></div>`;
  $("#fx").onclick = () => dlg.close();
  $("#fPrint").onclick = () => window.print();
  $("#fPrev").onclick = () => openFicha(current[pos - 1].n);
  $("#fNext").onclick = () => openFicha(current[pos + 1].n);
  if (!dlg.open) dlg.showModal();
  dlg.scrollTop = 0;
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") $("#fNext")?.click();
  if (e.key === "ArrowLeft") $("#fPrev")?.click();
});

/* ---------- exportação ---------- */
function exportCSV(rows, tab) {
  const cols = [["Nº contrato","n"],["Unidade",r=>UN[r.un]||""],["Credor","cr"],["Valor",r=>r.v==null?"":r.v.toFixed(2).replace(".",",")],
    ["Modalidade","mod"],["Início",r=>fmtD(r.ini)],["Fim contrato",r=>fmtD(r.fim)],["Fim aditivo",r=>r.adt?fmtD(r.adt):""],["Fim efetivo",r=>fmtD(r.fe)],
    ["Secretaria","sec"],["Cidade","cid"],["Objeto","obj"],["Situação","sit"]];
  if (tab === "vig") cols.push(["Dias p/ vencer", r => r.d ?? ""], ["PNCP", r => PNCP_LBL[r.ps][0]], ["Link PNCP", r => r.p?.url || ""]);
  cols.push(["Minuta (Drive)", r => r.docs.map(d => DRIVE_FILE(d.id)).join(" ")]);
  const val = (r, c) => typeof c === "function" ? c(r) : r[c];
  const q = v => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = "﻿" + [cols.map(c => c[0]).join(";"), ...rows.map(r => cols.map(c => q(val(r, c[1]))).join(";"))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `contratos-tx-${tab === "vig" ? "vigentes" : "encerrados"}-${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- navegação, atalhos, tema ---------- */
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { state.tab = t.dataset.tab; render(); });
document.addEventListener("keydown", e => {
  if (dlg.open) return;
  const q = $("#q");
  if (e.key === "/" && q && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  if (e.key === "Escape" && q && document.activeElement === q) { state[state.tab].q = ""; render(); }
});
function save() { try { localStorage.setItem("ctx-state", JSON.stringify({tab: state.tab, sel: state.sel, vig: {...state.vig, page:0}, enc: {...state.enc, page:0}})); } catch {} }
function restore() { try { const s = JSON.parse(localStorage.getItem("ctx-state")); if (s) { state.tab = s.tab || "vig"; state.sel = s.sel || ""; Object.assign(state.vig, s.vig); Object.assign(state.enc, s.enc); } } catch {} }
const themeBtn = $("#themeBtn");
try { const t = localStorage.getItem("ctx-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
themeBtn.onclick = () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("ctx-theme", document.documentElement.dataset.theme); } catch {}
};

load();
})();
</script>
</body>
</html>
